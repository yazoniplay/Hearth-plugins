name: CloudSMPWeapons
version: 1.0.0
main: dev.cloudsmp.weapons.CloudSMPWeapons
api-version: '1.21.11'
author: CloudSMP
description: Custom PvP weapons and weapon selection GUI for CloudSMP
commands:
  weapons:
    description: Open the CloudSMP custom weapons menu
    usage: /weapons
  weapon:
    description: Give yourself a CloudSMP custom weapon
    usage: /weapon <mace|rapidcrossbow|explosivebow|stunaxe|pulltrident>
    permission: cloudsmpweapons.admin
permissions:
  cloudsmpweapons.admin:
    description: Allows giving custom weapons
    default: op
