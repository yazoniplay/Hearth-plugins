# HearthWorld
# The frozen identity of Hearth SMP.

world:
  name: "world"

generation:
  terrain-sculpting: true
  snow-cover: true
  frozen-water: true
  snow-drifts: true
  icicles: true
  winter-structures: true
  structure-chance: 0.018

regions:
  frozen-taiga: true
  snowy-pinewood: true
  glacier-fields: true
  frostpeak-mountains: true
  snowstorm-plains: true
  frozen-grove: true
  icebound-coast: true
  frost-valley: true
  aurora-peaks: true

ambience:
  permanent-storm: true
  thunder: false
  aurora: true
  aurora-interval-ticks: 200
  aurora-min-height: 90
  snow-accumulation-height: 8

structures:
  cabins: true
  frozen-springs: true
  glacier-formation: true

events:
  enabled: true
  blizzards:
    enabled: true
    interval-ticks: 600
    duration-ticks: 1200

season:
  id: "the-first-flame"
  name: "The First Flame"
  description: "The world froze. The Hearth survived."
