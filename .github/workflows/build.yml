name: Build Hearth

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: hearth-plugins
          path: '**/build/libs/*.jar'
